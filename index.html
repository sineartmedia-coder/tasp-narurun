<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d1117" />
  <title>Meyve Suyu AR | Artırılmış Gerçeklik Deneyimi</title>
  <meta name="description" content="Meyve suyu kutusunu kameraya tut, içindekiler anında canlanıyor!" />

  <!--
    MindAR 1.2.5 — bu bundle A-Frame'i zaten içeriyor.
    AYRI aframe.min.js yükleme → siyah ekran hatası!
  -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* YÜKLEME EKRANI */
    #loading-screen {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: linear-gradient(135deg, #0d1117, #161b22);
      color: #e6edf3;
      transition: opacity 0.5s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }

    .logo {
      width: 72px; height: 72px; border-radius: 18px;
      background: linear-gradient(135deg, #f97316, #eab308);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform:scale(1); }
      50%      { transform:scale(1.1); }
    }

    .loading-title {
      font-size: 20px; font-weight: 700;
      background: linear-gradient(90deg, #f97316, #eab308);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .loading-sub { font-size: 13px; color: #8b949e; text-align: center; max-width: 260px; line-height: 1.6; }

    .bar-wrap { width: 220px; height: 3px; background: #21262d; border-radius: 99px; overflow: hidden; }
    .bar { height:100%; background: linear-gradient(90deg,#f97316,#eab308); border-radius:99px; animation: prog 3s ease-in-out forwards; }
    @keyframes prog { 0%{width:0%} 100%{width:100%} }

    /* HUD */
    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
    }
    .brand { color: #fff; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
    .dot { width:8px; height:8px; border-radius:50%; background:#22c55e; animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
    .badge { font-size:11px; color:#f97316; border:1px solid rgba(249,115,22,0.4); border-radius:99px; padding:3px 10px; }

    /* HINT */
    #hint {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      padding: 16px 20px 28px;
      display: flex; justify-content: center;
      background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent 100%);
      transition: opacity 0.4s;
    }
    #hint p { font-size: 13px; color: rgba(255,255,255,0.8); text-align: center; }

    /* TARAMA ÇERÇEVESİ */
    #frame {
      position: fixed; top:50%; left:50%;
      transform: translate(-50%,-50%);
      width: 200px; height: 280px;
      pointer-events: none; z-index: 100;
      transition: opacity 0.4s;
    }
    #frame::before,#frame::after,#frame .c { position:absolute; content:''; width:28px; height:28px; border-color:rgba(249,115,22,0.9); border-style:solid; }
    #frame::before { top:0;left:0; border-width:3px 0 0 3px; border-radius:4px 0 0 0; }
    #frame::after  { bottom:0;right:0; border-width:0 3px 3px 0; border-radius:0 0 4px 0; }
    #frame .c.tr   { top:0;right:0; border-width:3px 3px 0 0; border-radius:0 4px 0 0; }
    #frame .c.bl   { bottom:0;left:0; border-width:0 0 3px 3px; border-radius:0 0 0 4px; }
    .scan-line {
      position:absolute; left:0; right:0; height:2px;
      background: linear-gradient(90deg,transparent,rgba(249,115,22,0.9),transparent);
      animation: scan 2s linear infinite;
    }
    @keyframes scan { 0%{top:0} 100%{top:100%} }

    a-scene { position: fixed !important; inset: 0 !important; }
  </style>
</head>
<body>

  <!-- YÜKLEME EKRANI -->
  <div id="loading-screen">
    <div class="logo">🍹</div>
    <div class="loading-title">Meyve Suyu AR</div>
    <div class="loading-sub">Kamera hazırlanıyor…<br>Kamera iznini kabul et</div>
    <div class="bar-wrap"><div class="bar"></div></div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="brand"><span class="dot"></span>Meyve AR</div>
    <span class="badge">LIVE AR</span>
  </div>

  <!-- TARAMA ÇERÇEVESİ -->
  <div id="frame">
    <div class="c tr"></div>
    <div class="c bl"></div>
    <div class="scan-line"></div>
  </div>

  <!-- HINT -->
  <div id="hint"><p>📦 Meyve suyu kutusunu kameraya göster</p></div>

  <!-- ══════════════════════════════════════
       A-FRAME + MindAR SAHNESI

       KONUM REFERANSI:
         X: sağ(+) / sol(-)
         Y: yukarı(+) / aşağı(-)
         Z: öne(+) / arkaya(-)
       1 birim ≈ hedef görselin genişliği
  ══════════════════════════════════════ -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets timeout="15000">
      <img id="armut-img" src="./armut.png" crossorigin="anonymous" />
      <img id="elma-img"  src="./elma.png"  crossorigin="anonymous" />
    </a-assets>

    <!-- Kamera -->
    <a-camera position="0 0 0" look-controls="enabled:false" wasd-controls="enabled:false"></a-camera>

    <!-- ── HEDEF #0: Meyve Suyu Kutusu ── -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- SOL (-0.55): ARMUT
           x=-0.55 → sol tarafa 0.55 birim
           Grubu yukarı-aşağı sallar -->
      <a-entity position="-0.55 0 0.05"
        animation__float="property:position; from:-0.55 0.04 0.05; to:-0.55 -0.04 0.05; dur:2200; dir:alternate; loop:true; easing:easeInOutSine;">

        <!-- Glow halkası -->
        <a-circle radius="0.22" position="0 0.18 -0.01"
          material="color:#fbbf24; transparent:true; opacity:0.15; shader:flat;"
          animation__p="property:material.opacity; from:0.05; to:0.3; dur:1600; dir:alternate; loop:true;">
        </a-circle>

        <!-- Armut görseli — position y=0.18: ikonun biraz yukarıda olması için -->
        <a-image src="#armut-img" position="0 0.18 0" width="0.36" height="0.36"
          material="alphaTest:0.1; transparent:true;"
          animation__spin="property:rotation; from:0 -12 0; to:0 12 0; dur:3000; dir:alternate; loop:true; easing:easeInOutSine;">
        </a-image>

        <!-- Etiket: y=-0.07 → görselin hemen altında -->
        <a-text value="Armut Ozu" position="0 -0.07 0" align="center" color="#fbbf24" width="1.3"></a-text>
        <!-- Yüzde: y=-0.18 → etiketin altında -->
        <a-text value="%50" position="0 -0.18 0" align="center" color="#f59e0b" width="0.95"></a-text>
      </a-entity>


      <!-- SAĞ (+0.55): ELMA
           x=+0.55 → sağ tarafa 0.55 birim
           Ters fazda sallar (armutun tersine) -->
      <a-entity position="0.55 0 0.05"
        animation__float="property:position; from:0.55 -0.04 0.05; to:0.55 0.04 0.05; dur:2200; dir:alternate; loop:true; easing:easeInOutSine;">

        <!-- Glow halkası -->
        <a-circle radius="0.22" position="0 0.18 -0.01"
          material="color:#f87171; transparent:true; opacity:0.15; shader:flat;"
          animation__p="property:material.opacity; from:0.3; to:0.05; dur:1600; dir:alternate; loop:true;">
        </a-circle>

        <!-- Elma görseli -->
        <a-image src="#elma-img" position="0 0.18 0" width="0.36" height="0.36"
          material="alphaTest:0.1; transparent:true;"
          animation__spin="property:rotation; from:0 12 0; to:0 -12 0; dur:3000; dir:alternate; loop:true; easing:easeInOutSine;">
        </a-image>

        <a-text value="Elma Ozu" position="0 -0.07 0" align="center" color="#f87171" width="1.3"></a-text>
        <a-text value="%50" position="0 -0.18 0" align="center" color="#ef4444" width="0.95"></a-text>
      </a-entity>


      <!-- ÜST (y=0.6): BİLGİ PANELİ
           y=+0.6 → kutunun tepesine 0.6 birim yukarı -->
      <a-entity position="0 0.6 0.05"
        animation__entry="property:scale; from:0.01 0.01 0.01; to:1 1 1; dur:500; easing:easeOutBack;">

        <!-- Panel arka plan -->
        <a-plane width="1.0" height="0.38" position="0 0 -0.003"
          material="color:#0d1117; transparent:true; opacity:0.88; shader:flat;"></a-plane>
        <!-- Panel çerçeve -->
        <a-plane width="1.03" height="0.41" position="0 0 -0.004"
          material="color:#f97316; transparent:true; opacity:0.28; shader:flat;"></a-plane>

        <!-- Başlık -->
        <a-text value="Icindekiler" position="0 0.13 0" align="center" color="#8b949e" width="1.6"></a-text>

        <!-- Sol yüzde -->
        <a-text value="%50 Armut" position="-0.24 0 0" align="center" color="#fbbf24" width="1.1"></a-text>

        <!-- Dikey ayırıcı -->
        <a-plane width="0.004" height="0.22" material="color:#30363d; shader:flat;"></a-plane>

        <!-- Sağ yüzde -->
        <a-text value="%50 Elma" position="0.24 0 0" align="center" color="#f87171" width="1.1"></a-text>

        <!-- Progress bar – Armut -->
        <a-plane width="0.46" height="0.028" position="-0.25 -0.13 0"
          material="color:#fbbf24; shader:flat;"
          animation__g="property:material.opacity; from:0.65; to:1; dur:1200; dir:alternate; loop:true;"></a-plane>

        <!-- Progress bar – Elma -->
        <a-plane width="0.46" height="0.028" position="0.25 -0.13 0"
          material="color:#f87171; shader:flat;"
          animation__g="property:material.opacity; from:1; to:0.65; dur:1200; dir:alternate; loop:true;"></a-plane>
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const scene   = document.querySelector('a-scene');
    const loading = document.getElementById('loading-screen');
    const frame   = document.getElementById('frame');
    const hint    = document.getElementById('hint');

    function hideLoading() {
      loading.classList.add('hidden');
      setTimeout(() => loading.style.display = 'none', 600);
    }
    scene.hasLoaded ? hideLoading() : scene.addEventListener('loaded', hideLoading);

    const target = document.querySelector('[mindar-image-target]');
    if (target) {
      target.addEventListener('targetFound', () => {
        frame.style.opacity = '0';
        hint.style.opacity  = '0';
      });
      target.addEventListener('targetLost', () => {
        frame.style.opacity = '1';
        hint.style.opacity  = '1';
      });
    }
  </script>

</body>
</html>
