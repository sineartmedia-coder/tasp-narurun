<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Meyve Suyu AR</title>

  <!-- A-Frame 1.4.2 — MindAR 1.2.5 ile uyumlu -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }

    #splash {
      position: fixed; inset: 0; z-index: 9999;
      background: #0d1117;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font-family: system-ui, sans-serif; color: #fff;
      transition: opacity 0.4s;
    }
    #splash.out { opacity: 0; pointer-events: none; }
    #splash h1  { font-size: 22px; margin: 0; }
    #splash p   { font-size: 14px; color: #8b949e; text-align: center; max-width: 260px; margin: 0; }
    #splash button {
      padding: 14px 48px; font-size: 17px; font-weight: 700;
      background: linear-gradient(135deg, #f97316, #eab308);
      border: none; border-radius: 99px; color: #000; cursor: pointer;
    }

    #ui { position: fixed; inset: 0; z-index: 100; pointer-events: none; font-family: system-ui, sans-serif; }
    #frame-box {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 200px; height: 280px;
      border: 2px solid rgba(249,115,22,0.6); border-radius: 8px;
    }
    #ui-bottom {
      position: absolute; bottom: 30px; left: 0; right: 0;
      text-align: center; color: rgba(255,255,255,0.8); font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="splash">
    <div style="font-size:50px">🍹</div>
    <h1>Meyve Suyu AR</h1>
    <p>Meyve suyu kutusunu veya motorcu kaskını kameraya tut!</p>
    <button onclick="document.getElementById('splash').classList.add('out')">📷 Kamerayı Başlat</button>
    <p style="font-size:11px;color:#555">Kamera izni istenecek — İzin Ver'e bas</p>
  </div>

  <div id="ui">
    <div id="frame-box"></div>
    <div id="ui-bottom">📦 Meyve suyu kutusunu veya Kaskı göster</div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <img id="armut-img" src="./armut.png" crossorigin="anonymous" />
      <img id="elma-img"  src="./elma.png"  crossorigin="anonymous" />
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- TAKİP NOKTALARI (GÖRÜNMEZ ÇAPALAR) -->
    <a-entity id="tracker-0" mindar-image-target="targetIndex: 0"></a-entity>
    <a-entity id="tracker-1" mindar-image-target="targetIndex: 1"></a-entity>
    <a-entity id="tracker-2" mindar-image-target="targetIndex: 2"></a-entity>
    <a-entity id="tracker-3" mindar-image-target="targetIndex: 3"></a-entity>

    <!-- ── HEDEF #0 GÖRSELLERİ (MEYVE SUYU) ── -->
    <a-entity id="visual-0" smooth-tracker="target: #tracker-0; speed: 0.25">
      <!-- ARMUT — SOL TARAF -->
      <a-entity id="armut-group" position="-0.35 0 0.05">
        <a-plane width="0.38" height="0.38" position="0 0.1 -0.01" material="color:#0d1117; transparent:true; opacity:0.85; shader:flat;"></a-plane>
        <a-image src="#armut-img" position="0 0.18 0" width="0.30" height="0.30" material="alphaTest:0.5; transparent:true; depthWrite:false;"></a-image>
        <a-text value="Armut Ozu" position="0 -0.02 0" align="center" color="#fbbf24" width="1.1"></a-text>
        <a-text value="%50" position="0 -0.10 0" align="center" color="#f59e0b" width="0.85"></a-text>
      </a-entity>

      <!-- ELMA — SAĞ TARAF -->
      <a-entity id="elma-group" position="0.35 0 0.05">
        <a-plane width="0.38" height="0.38" position="0 0.1 -0.01" material="color:#0d1117; transparent:true; opacity:0.85; shader:flat;"></a-plane>
        <a-image src="#elma-img" position="0 0.18 0" width="0.30" height="0.30" material="alphaTest:0.5; transparent:true; depthWrite:false;"></a-image>
        <a-text value="Elma Ozu" position="0 -0.02 0" align="center" color="#f87171" width="1.1"></a-text>
        <a-text value="%50" position="0 -0.10 0" align="center" color="#ef4444" width="0.85"></a-text>
      </a-entity>

      <!-- BİLGİ PANELİ — ÜST -->
      <a-entity id="panel" position="0 0.55 0.05">
        <a-plane width="0.9" height="0.32" position="0 0 -0.002" material="color:#0d1117; transparent:true; opacity:0.9; shader:flat;"></a-plane>
        <a-plane width="0.97" height="0.36" position="0 0 -0.003" material="color:#f97316; transparent:true; opacity:0.3; shader:flat;"></a-plane>
        <a-text value="Icindekiler" position="0 0.11 0" align="center" color="#8b949e" width="1.5"></a-text>
        <a-text value="%50 Armut" position="-0.22 -0.01 0" align="center" color="#fbbf24" width="1.0"></a-text>
        <a-plane width="0.003" height="0.18" material="color:#30363d;shader:flat;"></a-plane>
        <a-text value="%50 Elma" position="0.22 -0.01 0" align="center" color="#f87171" width="1.0"></a-text>
        <a-plane width="0.42" height="0.022" position="-0.23 -0.12 0" material="color:#fbbf24;shader:flat;"></a-plane>
        <a-plane width="0.42" height="0.022" position=" 0.23 -0.12 0" material="color:#f87171;shader:flat;"></a-plane>
      </a-entity>
    </a-entity>

    <!-- ── HEDEF #1 GÖRSELLERİ (KASK) ── -->
    <a-entity id="visual-1" smooth-tracker="target: #tracker-1; speed: 0.25">
      <a-entity position="0 0.5 0.05">
        <a-plane width="1.1" height="0.4" position="0 0 -0.002" material="color:#0d1117; transparent:true; opacity:0.9; shader:flat;"></a-plane>
        <a-plane width="1.13" height="0.43" position="0 0 -0.003" material="color:#3b82f6; transparent:true; opacity:0.4; shader:flat;"></a-plane>
        <a-text value="PRO BIKER KASK" position="0 0.1 0" align="center" color="#60a5fa" width="1.8"></a-text>
        <a-text value="Tam Koruma & Aerodinamik" position="0 0.01 0" align="center" color="#94a3b8" width="1.0"></a-text>
        <a-text value="Fiyat: 2,999 TL" position="0 -0.1 0" align="center" color="#fbbf24" width="1.5"></a-text>
      </a-entity>
    </a-entity>

    <!-- ── HEDEF #2 GÖRSELLERİ (BURCU) ── -->
    <a-entity id="visual-2" smooth-tracker="target: #tracker-2; speed: 0.25">
      <a-entity position="0 0.4 0.05">
        <a-plane width="1.2" height="0.3" position="0 0 -0.002" material="color:#0d1117; transparent:true; opacity:0.85; shader:flat;"></a-plane>
        <a-plane width="1.23" height="0.33" position="0 0 -0.003" material="color:#ec4899; transparent:true; opacity:0.5; shader:flat;"></a-plane>
        <a-text value="Burcu Halkla Iliskiler 😎" position="0 0 0" align="center" color="#fbcfe8" width="1.5"></a-text>
      </a-entity>
    </a-entity>

    <!-- ── HEDEF #3 GÖRSELLERİ (MEHPARE MÜDÜR) ── -->
    <a-entity id="visual-3" smooth-tracker="target: #tracker-3; speed: 0.25">
      <a-entity position="0 0.4 0.05">
        <a-plane width="1.2" height="0.3" position="0 0 -0.002" material="color:#0d1117; transparent:true; opacity:0.85; shader:flat;"></a-plane>
        <a-plane width="1.23" height="0.33" position="0 0 -0.003" material="color:#f59e0b; transparent:true; opacity:0.5; shader:flat;"></a-plane>
        <a-text value="Mehpare Mudur 😀" position="0 0 0" align="center" color="#fde68a" width="1.5"></a-text>
      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    // ── KESİN TİTREME ÇÖZÜCÜ: YUMUŞAK TAKİP SİSTEMİ ──
    AFRAME.registerComponent('smooth-tracker', {
      schema: {
        target: {type: 'selector'},
        speed: {type: 'number', default: 0.2}
      },
      init: function () {
        this.target3D = this.data.target.object3D;
        this.el3D = this.el.object3D;
        this.wasVisible = false;
        
        // Başlangıçta görünmez yap
        this.el3D.visible = false;
      },
      tick: function (time, timeDelta) {
        if (!this.target3D) return;

        // Hedef AR noktasının görünürlüğünü kontrol et
        const isVisible = this.target3D.visible;
        this.el3D.visible = isVisible;

        if (isVisible) {
          if (!this.wasVisible) {
            // Hedef kameraya yeni girdiyse, animasyonsuz anında ışınla
            this.el3D.position.copy(this.target3D.position);
            this.el3D.quaternion.copy(this.target3D.quaternion);
            this.el3D.scale.copy(this.target3D.scale);
            this.wasVisible = true;
          } else {
            // Zaten takip ediliyorsa, yumuşak geçiş yap (titremeyi sönümler)
            // Cihazın FPS'ine göre (genelde 16ms) hesaplanan matematiksel Lerp
            const lerpFactor = Math.min(this.data.speed * (timeDelta / 16.66), 1.0);
            
            this.el3D.position.lerp(this.target3D.position, lerpFactor);
            this.el3D.quaternion.slerp(this.target3D.quaternion, lerpFactor);
            this.el3D.scale.lerp(this.target3D.scale, lerpFactor);
          }
        } else {
          this.wasVisible = false;
        }
      }
    });

    // ── HEDEF EVENTLARI ─────────────────────────────────
    document.querySelector('a-scene').addEventListener('loaded', function () {
      const target  = document.querySelector('[mindar-image-target]');
      const frameBox = document.getElementById('frame-box');
      const uiBottom = document.getElementById('ui-bottom');
      if (!target) return;

      target.addEventListener('targetFound', () => {
        frameBox.style.opacity = '0';
        uiBottom.style.opacity = '0';
      });
      target.addEventListener('targetLost', () => {
        frameBox.style.opacity = '1';
        uiBottom.style.opacity = '1';
      });
    });
  </script>

</body>
</html>
